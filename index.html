<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Loading...</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000;color:#00ff41;font-family:'Courier New',monospace;z-index:10;transition:opacity .4s}
#bar{width:200px;height:2px;background:#0a2a12;border-radius:2px;overflow:hidden}
#fill{height:100%;width:40%;background:#00ff41;animation:slide 1.1s ease-in-out infinite;border-radius:2px}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
#msg{font-size:12px;letter-spacing:3px}
iframe{position:fixed;inset:0;width:100%;height:100%;border:none;display:block}
</style>
</head>
<body>
<div id="load">
  <div id="msg">LOADING</div>
  <div id="bar"><div id="fill"></div></div>
</div>
<iframe id="f" allowfullscreen allow="fullscreen; gamepad; autoplay; encrypted-media" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation"></iframe>
<script>
(function(){
  var p     = new URLSearchParams(location.search);
  var app   = p.get('app')   || p.get('url') || p.get('u');
  var cloak = p.get('cloak') || '';
  var fav   = p.get('favicon') || '';

  if (cloak) document.title = cloak;
  else if (app) document.title = 'Loading...';

  if (fav) {
    var l = document.createElement('link');
    l.rel = 'icon'; l.href = fav;
    document.head.appendChild(l);
  } else {
    var l2 = document.createElement('link');
    l2.rel = 'icon'; l2.href = 'data:';
    document.head.appendChild(l2);
  }

  var frame = document.getElementById('f');
  var loadEl = document.getElementById('load');

  if (!app) {
    loadEl.innerHTML = '<div id="msg" style="color:#666">NO APP SPECIFIED</div>';
    return;
  }

  // Support raw github / githack links automatically
  app = app.replace('raw.githubusercontent.com', 'rawcdn.githack.com');

  frame.addEventListener('load', function(){ loadEl.style.opacity = '0'; setTimeout(function(){ loadEl.style.display = 'none'; }, 400); });
  frame.src = app;
})();
</script>
</body>
</html>
